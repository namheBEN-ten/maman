<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>امروز عصر 🎀</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800&display=swap');
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Vazirmatn,Tahoma,sans-serif;background:linear-gradient(135deg,#ffd6e7,#f7b8d4,#ffeaf3);display:flex;align-items:center;justify-content:center;overflow:hidden;color:#6b2145}
body:before,body:after{content:"";position:fixed;width:280px;height:280px;border-radius:50%;filter:blur(55px);opacity:.45;z-index:-1}body:before{background:#ff9fc6;top:-90px;right:-80px}body:after{background:#fff;bottom:-110px;left:-90px}
.card{width:min(92%,520px);min-height:440px;padding:42px 32px;background:#ffffffb8;backdrop-filter:blur(18px);border:1px solid #ffffffcc;border-radius:32px;box-shadow:0 25px 70px #8523532e;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;animation:appear .6s ease}
@keyframes appear{from{opacity:0;transform:translateY(22px) scale(.96)}to{opacity:1;transform:none}}.bow{font-size:58px;margin-bottom:12px;animation:bowBeat 1.4s infinite}@keyframes bowBeat{0%,100%{transform:scale(1)}50%{transform:scale(1.1) rotate(-3deg)}}
h1{margin:5px 0 12px;font-size:clamp(27px,7vw,38px);font-weight:800}p{font-size:17px;margin:0 0 28px;color:#8c4969}.buttons{display:flex;gap:15px;align-items:center;justify-content:center;min-height:60px}
button{border:0;border-radius:16px;padding:14px 30px;font-family:inherit;font-size:16px;font-weight:700;cursor:pointer;transition:.25s ease}.yes{color:white;background:linear-gradient(135deg,#e84d91,#c92d72);box-shadow:0 10px 25px #c92d7240}.yes:hover,.option:hover{transform:translateY(-3px)}.no{color:#b52e68;background:#ffe0ec}
.options{width:100%;max-width:390px;display:grid;grid-template-columns:1fr 1fr;gap:14px}.option{width:100%;color:#8d2859;background:#ffe0ecd9;border:2px solid transparent;padding:17px 12px;box-shadow:0 7px 18px #aa356914}.option:hover{border-color:#e65b98;background:#fff}
.message{min-height:28px;margin-top:15px;color:#b52e68;font-size:14px}.hidden{display:none}.final{font-size:30px;font-weight:800;line-height:1.8}
@media(max-width:420px){.card{padding:36px 22px}.options{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="card" id="page1">
<div class="bow">🎀</div><h1>آماده‌ای بریم بیرون؟</h1><p>یه انتخاب ساده داری...</p>
<div class="buttons"><button class="yes" onclick="show('page2')">آره 🎀</button><button class="no" id="noBtn" onclick="noClick()">نه</button></div>
<div class="message" id="message"></div></div>

<div class="card hidden" id="page2">
<div class="bow">🎀</div><h1>کجا بریم؟</h1><p>یکی رو انتخاب کن</p>
<div class="options"><button class="option" onclick="choosePlace('رستوران')">🍽️ رستوران</button><button class="option" onclick="choosePlace('کافه')">☕ کافه</button></div></div>

<div class="card hidden" id="restaurant">
<div class="bow">🎀</div><h1>چی بخوریم؟</h1><p>انتخاب با توئه</p>
<div class="options">
<button class="option" onclick="finish('کباب')">کباب</button><button class="option" onclick="finish('جوجه')">جوجه</button>
<button class="option" onclick="finish('پیتزا')">پیتزا</button><button class="option" onclick="finish('ساندویچ')">ساندویچ</button>
</div></div>

<div class="card hidden" id="cafe">
<div class="bow">🎀</div><h1>چی بخوریم؟</h1><p>انتخاب با توئه</p>
<div class="options">
<button class="option" onclick="finish('قهوه')">قهوه</button><button class="option" onclick="finish('چایی و کیک')">چایی و کیک</button>
<button class="option" onclick="finish('ماچا')">ماچا</button><button class="option" onclick="finish('میلک شیک')">میلک شیک</button>
</div></div>

<div class="card hidden" id="final"><div class="bow">🎀</div><div class="final">امروز عصر منتظرتم! 🎀</div></div>

<script>
let n=0, place="";
const texts=['مطمئنی؟','واقعاً مطمئنی؟','آخرین فرصته 😏','بازم نه؟ 🥺','یه بار دیگه فکر کن...','هنوز می‌تونی آره رو بزنی 😌','باشه... ولی من منتظرم 🎀'];

function noClick(){
 n++;let b=document.getElementById('noBtn');
 b.textContent=texts[Math.min(n-1,texts.length-1)];
 b.style.transform=`scale(${Math.max(.35,1-n*.12)})`;
 document.getElementById('message').textContent='فکر کنم جواب درست رو می‌دونی... 🎀';
}
function show(id){
 document.querySelectorAll('.card').forEach(x=>x.classList.add('hidden'));
 document.getElementById(id).classList.remove('hidden');
}
function choosePlace(value){
 place=value;
 show(value==='رستوران'?'restaurant':'cafe');
}
async function finish(food){
 try{
   const data=new FormData();
   data.append('مکان',place);
   data.append('انتخاب',food);
   data.append('_subject','پاسخ جدید برای امروز عصر 🎀');
   await fetch('https://formspree.io/f/xaewbjvy',{method:'POST',body:data,headers:{'Accept':'application/json'}});
 }catch(e){}
 show('final');
}
</script>
</body>
</html>
